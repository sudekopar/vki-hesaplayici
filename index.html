<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>VKİ Hesaplayıcı ⚖️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>VKİ Hesaplayıcı</h1>
        <div class="input-group">
            <label>Kilo (kg):</label>
            <input type="number" id="weight" placeholder="Örn: 70">
        </div>
        <div class="input-group">
            <label>Boy (cm):</label>
            <input type="number" id="height" placeholder="Örn: 175">
        </div>
        <button id="calculateBtn">Hesapla</button>
        <div id="result">
            <p id="bmiValue"></p>
            <p id="bmiStatus"></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
